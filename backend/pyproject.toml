[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastiq-backend"
version = "1.0.0"
description = "ForecastIQ Backend Engine"
readme = "README.md"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
