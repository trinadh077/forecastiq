name: ForecastIQ CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-backend:
    name: Backend CI (Lint & Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecastiq
          POSTGRES_PASSWORD: forecastiq_password
          POSTGRES_DB: forecastiq_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov black isort

      - name: Code Formatting Check (Black & Isort)
        run: |
          black --check backend/
          isort --check-only backend/

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://forecastiq:forecastiq_password@localhost:5432/forecastiq_db_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-forecastiq-32-chars
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=term-missing

  lint-and-build-frontend:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Check & Vite Build
        working-directory: ./frontend
        run: npm run build
