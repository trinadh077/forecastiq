version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forecastiq_postgres
    restart: always
    environment:
      POSTGRES_USER: forecastiq
      POSTGRES_PASSWORD: forecastiq_password
      POSTGRES_DB: forecastiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecastiq -d forecastiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forecastiq_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: forecastiq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ForecastIQ
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://forecastiq:forecastiq_password@postgres:5432/forecastiq_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-secret-key-forecastiq-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: forecastiq_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
