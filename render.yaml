services:
  - type: web
    name: forecastiq-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./forecastiq_dev.db"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://forecastiq-frontend.onrender.com","https://forecastiq-00pd.onrender.com"]'

  - type: web
    name: forecastiq-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
