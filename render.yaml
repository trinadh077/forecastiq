services:
  - type: web
    name: forecastiq
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./forecastiq_dev.db"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://forecastiq-00pd.onrender.com"]'
